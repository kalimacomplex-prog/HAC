services:
  - type: web
    name: hac-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: HAC Platform

# hac-worker (Render, type: worker) foi removido daqui de propósito: ele
# reivindicava jobs em paralelo ao cloudagent (Discloud), sem nenhum
# fallback pro playwright_executor — quando ele ganhava a corrida por um
# job que precisava de browser, quebrava com
# "ModuleNotFoundError: No module named 'playwright'" (requirements.txt
# raiz não instala playwright; só playwright_executor/requirements.txt
# instala). O cloudagent é agora o único claimant de /worker/claim e
# único intermediário até o executor Playwright — ver src/cloudagent.
# O código em worker/ continua no repo só de referência; não precisa
# mais ser deployado.
